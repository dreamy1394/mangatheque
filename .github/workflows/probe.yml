name: Sonde Manga-news
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capturer les pages
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"
          fetch() { curl -sSL -A "$UA" -H "Accept-Language: fr-FR,fr" -o "probe/$1.html" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || echo "$1 FAIL"; }
          img() { curl -sSL -A "$UA" -o "probe/$1" -w "$1 %{http_code} %{size_download} %{content_type}\n" "$2"; }
          img ol-cover.jpg "https://covers.openlibrary.org/b/isbn/9791032716113-L.jpg?default=false"
          img bnf-cover.jpg "https://catalogue.bnf.fr/couverture?&appName=NE&idArk=ark:/12148/cb47614865f&couverture=1"
          fetch bnf-valk "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=bib.title%20all%20%22valkyrie%20apocalypse%22%20and%20bib.doctype%20any%20%22a%22&recordSchema=dublincore&maximumRecords=100"
          fetch bnf-intermarc "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=bib.isbn%20all%20%229791032716113%22&recordSchema=intermarcxchange&maximumRecords=1"
          fetch bnf-recent "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=bib.title%20all%20%22one%20piece%22%20and%20bib.publisher%20all%20%22glenat%22&recordSchema=dublincore&maximumRecords=100&sortKeys=date,,0"
          true
      - name: Enregistrer
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe && git commit -m "probe html" && git push
