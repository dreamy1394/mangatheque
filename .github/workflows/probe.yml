name: Sonde Manga-news
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capturer les pages
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"
          fetch() { curl -sSL -A "$UA" -H "Accept-Language: fr-FR,fr" -o "probe/$1.html" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" || echo "$1 FAIL"; }
          fetch gbooks "https://www.googleapis.com/books/v1/volumes?q=intitle:frieren&langRestrict=fr&maxResults=40&orderBy=newest&printType=books"
          fetch gbooks2 "https://www.googleapis.com/books/v1/volumes?q=frieren+ki-oon&maxResults=40"
          curl -sS -X POST -H "Content-Type: application/json" -o probe/anilist.html -w "anilist %{http_code} %{size_download}\n" https://graphql.anilist.co -d '{"query":"{ Page(perPage:3){ media(search:\"frieren\", type:MANGA){ title{romaji english native} status volumes chapters coverImage{large} synonyms } } }"}'
          fetch bnf "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query=bib.title%20all%20%22frieren%22&recordSchema=dublincore&maximumRecords=50"
          head -c 1500 probe/gbooks.html; echo; head -c 800 probe/anilist.html; echo; head -c 1500 probe/bnf.html; echo
          python3 - <<'PY'
          import json
          for f in ["probe/gbooks.html","probe/gbooks2.html"]:
              try:
                  d=json.load(open(f)); print(f, d.get("totalItems"), d.get("error",{}).get("message"))
                  for it in d.get("items",[])[:40]:
                      v=it["volumeInfo"]; print(" ", v.get("title"), "|", v.get("subtitle"), "|", v.get("publisher"), "|", v.get("publishedDate"), "|", "thumb" if v.get("imageLinks") else "-", "|", v.get("language"))
              except Exception as e: print(f, e)
          PY
          true
      - name: Enregistrer
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe && git commit -m "probe html" && git push
